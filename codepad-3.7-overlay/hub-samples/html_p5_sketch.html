<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#050a0c;overflow:hidden}</style></head><body>
<script src="lib:p5"></script>
<script>
let ps = [];
function setup() { createCanvas(windowWidth, windowHeight); colorMode(HSB, 360, 100, 100, 1); noStroke(); }
function windowResized() { resizeCanvas(windowWidth, windowHeight); }
function draw() {
  background(200, 40, 4, 0.25);
  if (mouseIsPressed || frameCount % 3 === 0) for (let i = 0; i < 4; i++) ps.push({ x: mouseX || width / 2, y: mouseY || height / 2, vx: random(-3, 3), vy: random(-3, 3), life: 1, h: (frameCount * 2 + i * 20) % 360 });
  ps = ps.filter(p => p.life > 0);
  for (const p of ps) { fill(p.h, 80, 100, p.life); circle(p.x, p.y, 6 + 14 * p.life); p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.012; }
  fill(0, 0, 100, 0.8); textSize(14); text('p5.js · particles: ' + ps.length, 12, 22);
}
</script></body></html>
