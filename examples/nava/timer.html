<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تایمر</title><style>:root{--nava-accent:#c6f135}
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101410;color:#edf4ed;font-family:Vazirmatn,Tahoma,sans-serif}body{min-height:100vh;background:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,#c6f135 15%,#101410),#101410 65%)}.nv-app{min-height:100vh;display:grid;place-items:center;padding:24px}.nv-card{width:min(100%,440px);padding:28px;border:1px solid #ffffff20;border-radius:28px;background:#171e19eF;box-shadow:0 24px 80px #0008;display:flex;flex-direction:column;gap:16px}.nv-brand{color:#c6f135;font-size:12px;letter-spacing:.08em}h1{font-size:28px;line-height:1.35;margin:0}.nv-copy{color:#b8c6ba;line-height:1.9;margin:0}.nv-value{font-size:24px;font-weight:700;margin:4px 0}.nv-input{width:100%;padding:14px 16px;border:1px solid #ffffff25;border-radius:14px;background:#0e130f;color:#fff;font:inherit;outline:none}.nv-input:focus{border-color:#c6f135;box-shadow:0 0 0 3px color-mix(in srgb,#c6f135 22%,transparent)}.nv-button{min-height:48px;padding:12px 18px;border:0;border-radius:14px;background:#c6f135;color:#11170e;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}.nv-button:active{transform:scale(.98);filter:brightness(.92)}.nv-image{width:100%;max-height:260px;object-fit:cover;border-radius:18px}

.nv-button.nv-packed{position:relative;isolation:isolate;overflow:hidden;align-self:center;width:min(100%,max(64px,var(--nv-width)));max-width:100%;min-width:0;aspect-ratio:var(--nv-ratio);height:auto;min-height:44px;flex-shrink:0;padding:12px 20px;border:2px solid var(--nv-second);border-radius:var(--nv-radius);background:var(--nv-first);color:var(--nv-ink);filter:none;transition:transform .15s}
.nv-packed .nv-button-label{position:relative;z-index:1;display:block;overflow-wrap:anywhere;line-height:1.5}
.nv-packed::before,.nv-packed::after{content:"";position:absolute;z-index:0;pointer-events:none;background:var(--nv-second)}
.nv-packed::before{width:6px;top:0;bottom:0;left:0}.nv-packed::after{width:24%;height:4px;right:14%;top:0}
.nv-packed[data-nava-layout="1"]::before{left:auto;right:0}.nv-packed[data-nava-layout="1"]::after{top:auto;bottom:0;right:auto;left:14%}
.nv-packed[data-nava-layout="2"]::before{width:12px;height:12px;left:6px;top:6px;bottom:auto;border-radius:50%}.nv-packed[data-nava-layout="2"]::after{top:auto;bottom:0;width:36%;right:14%}
.nv-packed[data-nava-layout="3"]::before{left:auto;right:0;width:10px;clip-path:polygon(0 0,100% 0,100% 100%,0 70%)}.nv-packed[data-nava-layout="3"]::after{left:14%;right:auto;width:28%}
.nv-button.nv-packed:active{filter:none;transform:scale(.98)}.nv-button:focus-visible{outline:3px solid #fff;outline-offset:4px}
.nv-message{margin:0;padding:12px 16px;border:1px solid #ffffff30;border-radius:12px;overflow-wrap:anywhere;color:#edf4ed;background:#101410}.nv-message[hidden]{display:none}
@media(max-width:360px){.nv-app{padding:12px}.nv-card{padding:18px}}
@media(prefers-reduced-motion:reduce){.nv-button{transition:none}.nv-button:active{transform:none}}

.nv-utility output{display:block;text-align:center;font:64px monospace;padding:32px 0;color:var(--nava-accent,#c6f135);direction:ltr}.nv-utility>div{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.nv-utility button{min-height:48px;border:1px solid #ffffff20;background:#27302b;color:white;border-radius:14px;font:inherit;cursor:pointer}</style></head><body><main class="nv-app"><div class="nv-card"><div class="nv-brand">یک دقیقه</div><h1>یک دقیقه</h1>
<section id="nava-kit-0" class="nv-utility"><output aria-live="polite">۰</output><div><button type="button" data-utility="start">شروع</button><button type="button" data-utility="pause">مکث</button><button type="button" data-utility="reset">از اول</button></div></section></div></main><script>(()=>{const state={};const actions=[];const calc=(e)=>{if(e.kind==="value")return e.value;if(e.kind==="name")return state[e.name];if(e.kind==="unary"){const v=Number(calc(e.child));return e.op==="-"?-v:v}const a=calc(e.left),b=calc(e.right);switch(e.op){case "+":return typeof a==="string"||typeof b==="string"?String(a??"")+String(b??""):Number(a)+Number(b);case "-":return Number(a)-Number(b);case "*":return Number(a)*Number(b);case "/":return Number(a)/Number(b);case "%":return Number(a)%Number(b);case "==":return a===b;case "!=":return a!==b;case "<":return a<b;case ">":return a>b;case "<=":return a<=b;case ">=":return a>=b;default:return ""}};const show=(v)=>typeof v==="number"?new Intl.NumberFormat("fa-IR").format(v):String(v??"");const render=()=>{document.querySelectorAll("[data-nava-bind]").forEach((el)=>{const key=el.getAttribute("data-nava-bind");el.textContent=show(state[key])})};document.querySelectorAll("[data-nava-input]").forEach((el)=>el.addEventListener("input",()=>{state[el.getAttribute("data-nava-input")]=el.value;render()}));document.querySelectorAll("[data-nava-button]").forEach((el)=>el.addEventListener("click",()=>{const index=Number(el.getAttribute("data-nava-button"));const action=actions[index];if(action?.kind==="assign"){state[action.name]=calc(action.expr);render()}else if(action?.kind==="say"){const output=document.querySelector("[data-nava-message]");if(output){output.textContent=action.text;output.hidden=false}}}));render()})();
(function mountUtility(id        , kind        , duration        ) {
  const root = document.getElementById(id) ;
  const output = root.querySelector             ("output") ;
  let count = 0, remaining = duration * 1000, deadline = 0, running = false;
  const render = () => {
    if (kind === "counter") output.textContent = new Intl.NumberFormat("fa-IR").format(count);
    else { const seconds = Math.ceil(Math.max(0, remaining) / 1000); output.textContent = String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0"); }
  };
  root.addEventListener("click", (event) => {
    const key = (event.target               ).closest             ("[data-utility]")?.dataset.utility;
    if (kind === "counter") { if (key === "add") count++; if (key === "sub") count--; if (key === "reset") count = 0; }
    else {
      if (key === "start" && remaining > 0) { deadline = Date.now() + remaining; running = true; }
      if (key === "pause") { if (running) remaining = Math.max(0, deadline - Date.now()); running = false; }
      if (key === "reset") { running = false; remaining = duration * 1000; }
    }
    render();
  });
  if (kind === "timer") {
    const update = () => { if (running) { remaining = Math.max(0, deadline - Date.now()); if (remaining === 0) running = false; render(); } requestAnimationFrame(update); };
    requestAnimationFrame(update);
  }
  render();
})("nava-kit-0","timer",60);</script></body></html>
