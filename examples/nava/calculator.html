<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ماشین‌حساب</title><style>:root{--nava-accent:#67f5a5}
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101410;color:#edf4ed;font-family:Vazirmatn,Tahoma,sans-serif}body{min-height:100vh;background:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,#67f5a5 15%,#101410),#101410 65%)}.nv-app{min-height:100vh;display:grid;place-items:center;padding:24px}.nv-card{width:min(100%,440px);padding:28px;border:1px solid #ffffff20;border-radius:28px;background:#171e19eF;box-shadow:0 24px 80px #0008;display:flex;flex-direction:column;gap:16px}.nv-brand{color:#67f5a5;font-size:12px;letter-spacing:.08em}h1{font-size:28px;line-height:1.35;margin:0}.nv-copy{color:#b8c6ba;line-height:1.9;margin:0}.nv-value{font-size:24px;font-weight:700;margin:4px 0}.nv-input{width:100%;padding:14px 16px;border:1px solid #ffffff25;border-radius:14px;background:#0e130f;color:#fff;font:inherit;outline:none}.nv-input:focus{border-color:#67f5a5;box-shadow:0 0 0 3px color-mix(in srgb,#67f5a5 22%,transparent)}.nv-button{min-height:48px;padding:12px 18px;border:0;border-radius:14px;background:#67f5a5;color:#11170e;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}.nv-button:active{transform:scale(.98);filter:brightness(.92)}.nv-image{width:100%;max-height:260px;object-fit:cover;border-radius:18px}

.nv-button.nv-packed{position:relative;isolation:isolate;overflow:hidden;align-self:center;width:min(100%,max(64px,var(--nv-width)));max-width:100%;min-width:0;aspect-ratio:var(--nv-ratio);height:auto;min-height:44px;flex-shrink:0;padding:12px 20px;border:2px solid var(--nv-second);border-radius:var(--nv-radius);background:var(--nv-first);color:var(--nv-ink);filter:none;transition:transform .15s}
.nv-packed .nv-button-label{position:relative;z-index:1;display:block;overflow-wrap:anywhere;line-height:1.5}
.nv-packed::before,.nv-packed::after{content:"";position:absolute;z-index:0;pointer-events:none;background:var(--nv-second)}
.nv-packed::before{width:6px;top:0;bottom:0;left:0}.nv-packed::after{width:24%;height:4px;right:14%;top:0}
.nv-packed[data-nava-layout="1"]::before{left:auto;right:0}.nv-packed[data-nava-layout="1"]::after{top:auto;bottom:0;right:auto;left:14%}
.nv-packed[data-nava-layout="2"]::before{width:12px;height:12px;left:6px;top:6px;bottom:auto;border-radius:50%}.nv-packed[data-nava-layout="2"]::after{top:auto;bottom:0;width:36%;right:14%}
.nv-packed[data-nava-layout="3"]::before{left:auto;right:0;width:10px;clip-path:polygon(0 0,100% 0,100% 100%,0 70%)}.nv-packed[data-nava-layout="3"]::after{left:14%;right:auto;width:28%}
.nv-button.nv-packed:active{filter:none;transform:scale(.98)}.nv-button:focus-visible{outline:3px solid #fff;outline-offset:4px}
.nv-message{margin:0;padding:12px 16px;border:1px solid #ffffff30;border-radius:12px;overflow-wrap:anywhere;color:#edf4ed;background:#101410}.nv-message[hidden]{display:none}
@media(max-width:360px){.nv-app{padding:12px}.nv-card{padding:18px}}
@media(prefers-reduced-motion:reduce){.nv-button{transition:none}.nv-button:active{transform:none}}

.nc-calculator{outline:none;width:100%;font-family:inherit}.nc-heading{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#a2b0a8}.nc-dot{width:7px;height:7px;border-radius:50%;background:var(--nava-accent,#c6f135);box-shadow:0 0 14px var(--nava-accent,#c6f135)}.nc-screen{padding:38px 0 24px;text-align:right;overflow:auto;min-height:145px}.nc-expression{font-size:24px;color:#a2b0a8;white-space:nowrap;min-height:35px}.nc-output{font-size:48px;line-height:1.35;font-weight:500;overflow-wrap:anywhere}.nc-output[data-error=true]{font-size:16px;color:#ff9da8}.nc-keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.nc-keys button{height:60px;border:1px solid #ffffff0b;border-radius:20px;background:#27302b;color:#f0f7f1;font:inherit;font-size:23px;cursor:pointer;touch-action:manipulation;transition:transform .12s,background .12s}.nc-keys button:active{transform:scale(.93);background:#39463e}.nc-keys .nc-op{background:#303d2a;color:var(--nava-accent,#c6f135)}.nc-keys .nc-equals{background:var(--nava-accent,#c6f135);color:#101810;font-weight:700}.nc-log{font-size:12px;color:#a2b0a8;margin-top:22px}.nc-log summary{cursor:pointer}.nc-history{padding-top:12px;line-height:2;overflow-wrap:anywhere}@media(max-width:360px){.nc-keys button{height:51px;border-radius:16px}.nc-output{font-size:40px}}</style></head><body><main class="nv-app"><div class="nv-card"><div class="nv-brand">ماشین‌حساب</div><h1>ماشین‌حساب</h1>
<section id="nava-kit-0" class="nc-calculator" tabindex="0" aria-label="ماشین‌حساب"><div class="nc-heading"><span>ماشین‌حساب</span><span class="nc-dot"></span></div><div class="nc-screen" aria-live="polite"><div class="nc-expression" dir="ltr">۰</div><div class="nc-output" dir="ltr">۰</div></div><div class="nc-keys" dir="ltr"><button type="button" data-calc-key="AC" class=" " aria-label="AC">AC</button><button type="button" data-calc-key="(" class=" " aria-label="( ">( </button><button type="button" data-calc-key=")" class=" " aria-label=" )"> )</button><button type="button" data-calc-key="/" class="nc-op " aria-label="÷">÷</button><button type="button" data-calc-key="7" class=" " aria-label="۷">۷</button><button type="button" data-calc-key="8" class=" " aria-label="۸">۸</button><button type="button" data-calc-key="9" class=" " aria-label="۹">۹</button><button type="button" data-calc-key="*" class="nc-op " aria-label="×">×</button><button type="button" data-calc-key="4" class=" " aria-label="۴">۴</button><button type="button" data-calc-key="5" class=" " aria-label="۵">۵</button><button type="button" data-calc-key="6" class=" " aria-label="۶">۶</button><button type="button" data-calc-key="-" class="nc-op " aria-label="−">−</button><button type="button" data-calc-key="1" class=" " aria-label="۱">۱</button><button type="button" data-calc-key="2" class=" " aria-label="۲">۲</button><button type="button" data-calc-key="3" class=" " aria-label="۳">۳</button><button type="button" data-calc-key="+" class="nc-op " aria-label="+">+</button><button type="button" data-calc-key="sign" class=" " aria-label="±">±</button><button type="button" data-calc-key="0" class=" " aria-label="۰">۰</button><button type="button" data-calc-key="." class=" " aria-label=".">.</button><button type="button" data-calc-key="=" class="nc-op nc-equals" aria-label="=">=</button><button type="button" data-calc-key="back" class=" " aria-label="حذف آخرین نویسه">⌫</button><button type="button" data-calc-key="%" class=" " aria-label="%">%</button></div><details class="nc-log"><summary>تاریخچهٔ این نشست</summary><div class="nc-history" dir="ltr"></div></details></section></div></main><script>(()=>{const state={};const actions=[];const calc=(e)=>{if(e.kind==="value")return e.value;if(e.kind==="name")return state[e.name];if(e.kind==="unary"){const v=Number(calc(e.child));return e.op==="-"?-v:v}const a=calc(e.left),b=calc(e.right);switch(e.op){case "+":return typeof a==="string"||typeof b==="string"?String(a??"")+String(b??""):Number(a)+Number(b);case "-":return Number(a)-Number(b);case "*":return Number(a)*Number(b);case "/":return Number(a)/Number(b);case "%":return Number(a)%Number(b);case "==":return a===b;case "!=":return a!==b;case "<":return a<b;case ">":return a>b;case "<=":return a<=b;case ">=":return a>=b;default:return ""}};const show=(v)=>typeof v==="number"?new Intl.NumberFormat("fa-IR").format(v):String(v??"");const render=()=>{document.querySelectorAll("[data-nava-bind]").forEach((el)=>{const key=el.getAttribute("data-nava-bind");el.textContent=show(state[key])})};document.querySelectorAll("[data-nava-input]").forEach((el)=>el.addEventListener("input",()=>{state[el.getAttribute("data-nava-input")]=el.value;render()}));document.querySelectorAll("[data-nava-button]").forEach((el)=>el.addEventListener("click",()=>{const index=Number(el.getAttribute("data-nava-button"));const action=actions[index];if(action?.kind==="assign"){state[action.name]=calc(action.expr);render()}else if(action?.kind==="say"){const output=document.querySelector("[data-nava-message]");if(output){output.textContent=action.text;output.hidden=false}}}));render()})();
(function mountCalculator(id        , evaluate                            ) {
  const root = document.getElementById(id) ;
  const expression = root.querySelector             (".nc-expression") ;
  const output = root.querySelector             (".nc-output") ;
  const history = root.querySelector             (".nc-history") ;
  let source = "", finished = false;
  const entries                                       = [];
  const fa = (s        ) => s.replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[Number(d)]).replace(/\*/g, "×").replace(/\//g, "÷");
  const render = () => {
    expression.textContent = fa(source) || "۰";
    try { output.textContent = source ? fa(String(evaluate(source))) : "۰"; output.dataset.error = "false"; }
    catch { output.textContent = "…"; }
  };
  const press = (key        ) => {
    if (key === "AC") { source = ""; finished = false; }
    else if (key === "back") { source = source.slice(0, -1); finished = false; }
    else if (key === "sign") {
      const negative = /\(-((?:\d*\.?\d+)(?:e[+-]?\d+)?)\)(%?)$/i.exec(source);
      const positive = /(\d*\.?\d+(?:e[+-]?\d+)?)(%?)$/i.exec(source);
      if (negative) source = source.slice(0, negative.index) + negative[1] + negative[2];
      else if (positive) source = source.slice(0, positive.index) + "(-" + positive[1] + ")" + positive[2];
      else if (!source) source = "-";
      finished = false;
    } else if (key === "=") {
      try {
        const answer = evaluate(source);
        entries.unshift({ source, answer }); entries.splice(8);
        history.replaceChildren();
        for (const item of entries) { const row = document.createElement("div"); row.textContent = fa(item.source) + " = " + fa(String(item.answer)); history.append(row); }
        source = String(answer); finished = true;
      } catch (error) { output.textContent = error instanceof Error ? error.message : "خطای محاسبه"; output.dataset.error = "true"; return; }
    } else if (source.length < 240) {
      if (finished && /^[\d.(]$/.test(key)) source = "";
      finished = false;
      if (/^[+*/]$/.test(key) && /[+*/-]$/.test(source)) source = source.slice(0, -1);
      source += key;
    }
    render();
  };
  root.addEventListener("click", (event) => {
    const button = (event.target               ).closest             ("[data-calc-key]");
    if (button) { root.focus({ preventScroll: true }); press(button.dataset.calcKey ); }
  });
  root.addEventListener("keydown", (event) => {
    const key = event.key === "Enter" ? "=" : event.key === "Backspace" ? "back" : event.key === "Escape" ? "AC" : event.key;
    if (/^[\d()+*/.=%-]$/.test(key) || ["back", "AC"].includes(key)) { event.preventDefault(); press(key); }
  });
  render();
})("nava-kit-0",function evaluateCalculator(source        )         {
  const normalized = source.replace(/[۰-۹]/g, (d) => String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))).replace(/×/g, "*").replace(/[÷]/g, "/").replace(/−/g, "-").replace(/\s/g, "");
  if (!normalized || normalized.length > 400) throw new Error("عبارت را کامل بنویس");
  const tokens = normalized.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?|[()+\-*/%]/gi) ?? [];
  if (tokens.join("") !== normalized) throw new Error("عبارت نامعتبر است");
  let at = 0;
  const number = ()         => {
    const token = tokens[at++];
    if (token === "+" || token === "-") return (token === "-" ? -1 : 1) * number();
    let value        ;
    if (token === "(") { value = add(); if (tokens[at++] !== ")") throw new Error("پرانتز را ببند"); }
    else if (token !== undefined && /^(?:\d|\.)/.test(token)) value = Number(token);
    else throw new Error("عبارت را کامل بنویس");
    while (tokens[at] === "%") { at++; value /= 100; }
    return value;
  };
  const multiply = ()         => {
    let value = number();
    while (tokens[at] === "*" || tokens[at] === "/") {
      const op = tokens[at++], right = number();
      if (op === "/" && right === 0) throw new Error("تقسیم بر صفر ممکن نیست");
      value = op === "*" ? value * right : value / right;
    }
    return value;
  };
  const add = ()         => {
    let value = multiply();
    while (tokens[at] === "+" || tokens[at] === "-") {
      const op = tokens[at++], start = at;
      let right = multiply();
      // Mobile-style additive percent: 200 + 10% = 220. A full RHS percent
      // participates as a relative rate; multiplication keeps percent /100.
      const rightTokens = tokens.slice(start, at);
      if (rightTokens.length >= 2 && rightTokens[rightTokens.length - 1] === "%" && !rightTokens.some((t) => t === "*" || t === "/")) right *= value;
      value = op === "+" ? value + right : value - right;
    }
    return value;
  };
  const value = add();
  if (at !== tokens.length || !Number.isFinite(value)) throw new Error("نتیجه قابل محاسبه نیست");
  return Number(value.toPrecision(12));
});</script></body></html>
