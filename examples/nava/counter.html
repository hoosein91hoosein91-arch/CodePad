:root{color-scheme:dark}*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;background:#101410;color:#edf4ed;font-family:Vazirmatn,Tahoma,sans-serif}body{min-height:100vh;background:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,#c6f135 15%,#101410),#101410 65%)}.nv-app{min-height:100vh;display:grid;place-items:center;padding:20px}.nv-card{width:min(100%,460px);padding:24px;border:1px solid #ffffff20;border-radius:28px;background:#171e19ef;box-shadow:0 24px 80px #0008;display:flex;flex-direction:column;gap:14px}.nv-brand{color:#c6f135;font-size:12px;letter-spacing:.08em}h1{font-size:26px;line-height:1.4;margin:0}.nv-copy{color:#b8c6ba;line-height:1.9;margin:0;white-space:pre-wrap}.nv-value{font-size:22px;font-weight:700;margin:2px 0;white-space:pre-wrap;line-height:1.7}.nv-input{width:100%;padding:13px 15px;border:1px solid #ffffff25;border-radius:14px;background:#0e130f;color:#fff;font:inherit;outline:none;resize:vertical}.nv-input:focus{border-color:#c6f135;box-shadow:0 0 0 3px color-mix(in srgb,#c6f135 22%,transparent)}.nv-button{min-height:48px;padding:11px 16px;border:0;border-radius:14px;background:#c6f135;color:#11170e;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s;touch-action:manipulation}.nv-button:active{transform:scale(.97);filter:brightness(.9)}.nv-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nv-row>*{flex:1 1 0;min-width:0}.nv-image{width:100%;max-height:260px;object-fit:cover;border-radius:18px}.nv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.nv-list li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#0e130f;border:1px solid #ffffff14}.nv-list li span{flex:1;overflow-wrap:anywhere}.nv-list .nv-empty{color:#7f8f82;justify-content:center}.nv-del{border:0;background:#ff6a7a22;color:#ff8f9b;border-radius:10px;width:32px;height:32px;font:inherit;cursor:pointer}.nv-canvas{display:block;width:100%;margin:0 auto;border-radius:18px;background:#05090699;border:1px solid #ffffff18;touch-action:none}.nv-scene{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,#c6f135 18%,#0b1220),#05070d)}.nv-error{padding:12px 14px;border-radius:14px;background:#3a1016;color:#ffb3bc;font-size:14px;line-height:1.8}.nv-toast{position:fixed;inset-inline:0;bottom:28px;margin:auto;width:max-content;max-width:86vw;padding:10px 16px;border-radius:14px;background:#000d;color:#c6f135;border:1px solid color-mix(in srgb,#c6f135 50%,transparent);font-weight:700;box-shadow:0 10px 40px #0009}

.nv-utility output{display:block;text-align:center;font:64px monospace;padding:32px 0;color:var(--nava-accent,#c6f135);direction:ltr}.nv-utility>div{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.nv-utility button{min-height:48px;border:1px solid #ffffff20;background:#27302b;color:white;border-radius:14px;font:inherit;cursor:pointer}</style></head><body><main class="nv-app"><div class="nv-card"><div class="nv-brand">امتیاز من</div>
<h1>امتیاز من</h1>
<section id="nava-kit-0" class="nv-utility"><output aria-live="polite">۰</output><div><button type="button" data-utility="sub">−</button><button type="button" data-utility="add">+</button><button type="button" data-utility="reset">از اول</button></div></section>
<p class="nv-message" role="status" aria-live="polite" aria-atomic="true" hidden></p><div class="nv-error" role="alert" hidden></div></div><div class="nv-toast" role="status" hidden></div></main><script>(()=>{const P={"title":"امتیاز من","accent":"#c6f135","vars":[],"persist":[],"actions":{},"start":[],"timers":[],"onTouch":null,"onKey":null,"buttons":[],"shows":[],"lists":[],"shapes":[],"canvas":null,"scene":null,"images":[]};const navaEngine=(function navaEngine(P     , io     )      {
  const S      = Object.create(null);
  const MAXLOOP = 100000;
  const MAXSTEPS = 3000000;
  const root      = { v: S, p: null };
  const has = (o     , k        ) => Object.prototype.hasOwnProperty.call(o, k);
  let steps = 0;
  let depth = 0;
  let timers        = [];
  let running = false;
  let lastSaved = "";
  let t0 = io.now();
  let reported = false;

  const fail = (line        , msg        )        => {
    const e      = new Error(msg);
    e.navaLine = line;
    throw e;
  };
  const digits = (s        ) =>
    String(s)
      .replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 1776))
      .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 1632))
      .replace(/٫/g, ".")
      .replace(/[٬,\s]/g, "");
  const numish = (v     ) => typeof v === "number" || (typeof v === "string" && /^\s*[-+]?[\d۰-۹٠-٩٬,]+(?:[.٫][\d۰-۹٠-٩]+)?\s*$/.test(v));
  const toNum = (v     )         => {
    if (typeof v === "number") return v;
    if (typeof v === "boolean") return v ? 1 : 0;
    if (Array.isArray(v)) return v.length;
    const n = Number(digits(String(v ?? "")));
    return Number.isFinite(n) ? n : 0;
  };
  const fmt = new Intl.NumberFormat("fa-IR", { maximumFractionDigits: 2 });
  const str = (v     )         =>
    typeof v === "number"
      ? Number.isFinite(v) ? fmt.format(v) : "∞"
      : typeof v === "boolean"
        ? v ? "درست" : "نادرست"
        : Array.isArray(v)
          ? v.map((x) => (Array.isArray(x) ? `[${str(x)}]` : str(x))).join("، ")
          : v == null ? "" : String(v);
  const truthy = (v     ) => (Array.isArray(v) ? v.length > 0 : !!v);
  const same = (a     , b     )          => {
    if (Array.isArray(a) || Array.isArray(b)) {
      if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
      return a.every((x, i) => same(x, b[i]));
    }
    if (typeof a === typeof b) return a === b;
    if (numish(a) && numish(b) && typeof a !== "boolean" && typeof b !== "boolean") return toNum(a) === toNum(b);
    return false;
  };
  const add = (a     , b     ) => {
    if (Array.isArray(a)) return a.concat(Array.isArray(b) ? b : [b]);
    if (typeof a === "number" && typeof b === "number") return a + b;
    if ((typeof a === "string" || typeof b === "string") && !(numish(a) && numish(b))) return str(a) + str(b);
    return toNum(a) + toNum(b);
  };
  const compare = (op        , a     , b     ) => {
    const x = numish(a) && numish(b) ? toNum(a) : str(a);
    const y = numish(a) && numish(b) ? toNum(b) : str(b);
    return op === "<" ? x < y : op === ">" ? x > y : op === "<=" ? x <= y : x >= y;
  };
  const rnd = (a      , b      ) => {
    if (a === undefined) return io.random();
    let lo = 1, hi = toNum(a);
    if (b !== undefined) { lo = toNum(a); hi = toNum(b); }
    if (hi < lo) { const t = lo; lo = hi; hi = t; }
    return Math.floor(io.random() * (Math.floor(hi) - Math.ceil(lo) + 1)) + Math.ceil(lo);
  };
  const nums = (xs       ) => xs.flatMap((x) => (Array.isArray(x) ? x : [x])).map(toNum);
  const rad = (d     ) => (toNum(d) * Math.PI) / 180;
  const B      = {
    تصادفی: rnd,
    طول: (x     ) => (Array.isArray(x) || typeof x === "string" ? x.length : str(x).length),
    گرد: (x     , d      ) => { const k = Math.pow(10, d === undefined ? 0 : toNum(d)); return Math.round(toNum(x) * k) / k; },
    صحیح: (x     ) => Math.trunc(toNum(x)),
    قدرمطلق: (x     ) => Math.abs(toNum(x)),
    جذر: (x     ) => Math.sqrt(toNum(x)),
    توان: (a     , b     ) => Math.pow(toNum(a), toNum(b)),
    حداقل: (...xs       ) => Math.min(...nums(xs)),
    حداکثر: (...xs       ) => Math.max(...nums(xs)),
    جمع: (...xs       ) => nums(xs).reduce((s, x) => s + x, 0),
    سینوس: (d     ) => Math.sin(rad(d)),
    کسینوس: (d     ) => Math.cos(rad(d)),
    فاصله: (x1     , y1     , x2     , y2     ) => Math.hypot(toNum(x2) - toNum(x1), toNum(y2) - toNum(y1)),
    عدد: (x     ) => toNum(x),
    متن: (x     ) => str(x),
    زمان: () => (io.now() - t0) / 1000,
    ساعت: () => new Date().toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" }),
    تاریخ: () => new Date().toLocaleDateString("fa-IR"),
    شامل: (a     , b     ) => (Array.isArray(a) ? a.some((x) => same(x, b)) : str(a).includes(str(b))),
    جای: (a     , b     ) => (Array.isArray(a) ? a.findIndex((x) => same(x, b)) : str(a).indexOf(str(b))) + 1,
    جدا: (s     , sep      ) => (sep === undefined ? str(s).split(/\s+/) : str(s).split(str(sep))).filter((x) => x !== ""),
    چسب: (l     , sep      ) => (Array.isArray(l) ? l : [l]).map(str).join(sep === undefined ? "، " : str(sep)),
    خطوط: (s     ) => str(s).split(/\r?\n/).filter((x) => x.trim() !== ""),
    برعکس: (l     ) => (Array.isArray(l) ? [...l].reverse() : [...str(l)].reverse().join("")),
    مرتب: (l     ) => (Array.isArray(l) ? [...l].sort((a, b) => (numish(a) && numish(b) ? toNum(a) - toNum(b) : str(a).localeCompare(str(b), "fa"))) : l),
    بخش: (l     , from     , to      ) => { const a = Array.isArray(l) ? l : str(l); const f = Math.max(0, toNum(from) - 1); return a.slice(f, to === undefined ? undefined : toNum(to)); },
    فایل: (name     ) => io.fileText(str(name)),
  };

  const lookup = (env     , name        , line        ) => {
    for (let e = env; e; e = e.p) if (has(e.v, name)) return e.v[name];
    return fail(line, `متغیر «${name}» تعریف نشده است.`);
  };
  const assign = (env     , name        , val     , line        ) => {
    for (let e = env; e; e = e.p) if (has(e.v, name)) { e.v[name] = val; return; }
    fail(line, `متغیر «${name}» تعریف نشده است.`);
  };
  const slot = (list     , i     , line        ) => {
    if (!Array.isArray(list) && typeof list !== "string") fail(line, "فقط لیست یا متن شماره دارد؛ مثل کارها[۱].");
    const n = Math.trunc(toNum(i));
    const pos = n < 0 ? list.length + n : n - 1;
    if (n === 0 || pos < 0 || pos >= list.length) fail(line, `شمارهٔ ${str(n)} در لیست نیست (طول لیست ${str(list.length)} است؛ شماره از ۱ شروع می‌شود).`);
    return pos;
  };

  const ev = (e     , env     , line        )      => {
    switch (e.k) {
      case "v": return e.v;
      case "n": return lookup(env, e.n, line);
      case "t": return e.parts.map((p     ) => (typeof p === "string" ? p : str(ev(p, env, line)))).join("");
      case "l": return e.items.map((x     ) => ev(x, env, line));
      case "i": { const base = ev(e.a, env, line); return base[slot(base, ev(e.i, env, line), line)]; }
      case "u": { const v = ev(e.a, env, line); return e.op === "!" ? !truthy(v) : e.op === "-" ? -toNum(v) : toNum(v); }
      case "c": {
        const args = e.args.map((x     ) => ev(x, env, line));
        const f = B[e.f];
        return f ? f(...args) : callUser(e.f, args, line);
      }
      case "b": {
        if (e.op === "&&") return truthy(ev(e.a, env, line)) ? truthy(ev(e.b, env, line)) : false;
        if (e.op === "||") return truthy(ev(e.a, env, line)) ? true : truthy(ev(e.b, env, line));
        const a = ev(e.a, env, line), b = ev(e.b, env, line);
        switch (e.op) {
          case "+": return add(a, b);
          case "-": return toNum(a) - toNum(b);
          case "*": return toNum(a) * toNum(b);
          case "/": if (toNum(b) === 0) fail(line, "تقسیم بر صفر ممکن نیست."); return toNum(a) / toNum(b);
          case "%": if (toNum(b) === 0) fail(line, "باقی‌ماندهٔ تقسیم بر صفر ممکن نیست."); return ((toNum(a) % toNum(b)) + toNum(b)) % toNum(b);
          case "==": return same(a, b);
          case "!=": return !same(a, b);
          default: return compare(e.op, a, b);
        }
      }
    }
    return fail(line, "عبارت نامعتبر است.");
  };

  const listOf = (env     , name        , line        ) => {
    const v = lookup(env, name, line);
    if (!Array.isArray(v)) fail(line, `«${name}» لیست نیست؛ آن را با «لیست ${name}» بساز.`);
    return v;
  };
  const child = (env     ) => ({ v: Object.create(null), p: env });
  const callUser = (name        , args       , line        )      => {
    const a = P.actions[name];
    if (!a) return fail(line, `کنش یا تابع «${name}» تعریف نشده است.`);
    if (++depth > 200) fail(line, "کنش‌ها بیش از حد همدیگر را صدا زده‌اند (بیش از ۲۰۰ لایه).");
    const env = child(root);
    a.params.forEach((p        , i        ) => { env.v[p] = args[i] === undefined ? "" : args[i]; });
    try { exec(a.body, env); return ""; }
    catch (err     ) { if (err && err.navaRet) return err.value === undefined ? "" : err.value; throw err; }
    finally { depth--; }
  };

  const exec = (body       , env     )       => {
    for (const s of body) {
      if (++steps > MAXSTEPS) fail(s.line, "اجرای برنامه بیش از حد طول کشید (شاید یک حلقهٔ بی‌پایان داری).");
      const E = (x     ) => ev(x, env, s.line);
      switch (s.k) {
        case "let": env.v[s.n] = E(s.e); break;
        case "set": {
          let val = E(s.e);
          if (s.idx && s.idx.length) {
            let target = lookup(env, s.n, s.line);
            for (let i = 0; i < s.idx.length - 1; i++) target = target[slot(target, E(s.idx[i]), s.line)];
            if (!Array.isArray(target)) fail(s.line, "فقط خانهٔ لیست را می‌شود عوض کرد.");
            const pos = slot(target, E(s.idx[s.idx.length - 1]), s.line);
            if (s.op === "+=") val = add(target[pos], val);
            else if (s.op === "-=") val = toNum(target[pos]) - toNum(val);
            target[pos] = val;
          } else {
            if (s.op === "+=") val = add(lookup(env, s.n, s.line), val);
            else if (s.op === "-=") val = toNum(lookup(env, s.n, s.line)) - toNum(val);
            assign(env, s.n, val, s.line);
          }
          break;
        }
        case "if": {
          let done = false;
          for (const br of s.br) if (truthy(E(br.c))) { exec(br.body, child(env)); done = true; break; }
          if (!done && s.els) exec(s.els, child(env));
          break;
        }
        case "rep": {
          const n = Math.trunc(toNum(E(s.n)));
          if (n > MAXLOOP) fail(s.line, "حداکثر ۱۰۰٬۰۰۰ بار تکرار مجاز است.");
          for (let i = 1; i <= n; i++) { const c = child(env); if (s.v) c.v[s.v] = i; exec(s.body, c); }
          break;
        }
        case "each": {
          const list = E(s.e);
          const items = Array.isArray(list) ? [...list] : typeof list === "string" ? [...list] : fail(s.line, "«برای هر» روی لیست یا متن کار می‌کند.");
          for (const x of items) { const c = child(env); c.v[s.v] = x; exec(s.body, c); }
          break;
        }
        case "for": {
          const from = toNum(E(s.from)), to = toNum(E(s.to));
          if (Math.abs(to - from) > MAXLOOP) fail(s.line, "حداکثر ۱۰۰٬۰۰۰ بار تکرار مجاز است.");
          const step = from <= to ? 1 : -1;
          for (let i = from; step > 0 ? i <= to : i >= to; i += step) { const c = child(env); c.v[s.v] = i; exec(s.body, c); }
          break;
        }
        case "while": {
          let guard = 0;
          while (truthy(E(s.c))) {
            if (++guard > MAXLOOP) fail(s.line, "حلقهٔ «تا وقتی» تمام نمی‌شود (بیش از ۱۰۰٬۰۰۰ دور).");
            exec(s.body, child(env));
          }
          break;
        }
        case "push": { const list = listOf(env, s.n, s.line); const v = E(s.e); if (s.front) list.unshift(v); else list.push(v); break; }
        case "del": {
          const list = listOf(env, s.n, s.line);
          if (s.which === "first") list.shift();
          else if (s.which === "last") list.pop();
          else if (s.which === "at") list.splice(slot(list, E(s.e), s.line), 1);
          else { const v = E(s.e); const i = list.findIndex((x     ) => same(x, v)); if (i >= 0) list.splice(i, 1); }
          break;
        }
        case "clear": listOf(env, s.n, s.line).length = 0; break;
        case "msg": io.toast(str(E(s.e))); break;
        case "tone": {
          const a = E(s.a[0]);
          if (typeof a === "string" && !numish(a)) io.play(a);
          else io.tone(toNum(a), s.a[1] ? toNum(E(s.a[1])) : 150);
          break;
        }
        case "melody": io.melody(s.a.map((x     ) => toNum(E(x))), 180); break;
        case "say": io.say(str(E(s.e))); break;
        case "ask": {
          const prompt = str(E(s.e));
          const target = s.n;
          S[target] = "… در حال فکر کردن";
          Promise.resolve()
            .then(() => io.ask(prompt))
            .then(
              (text     ) => { S[target] = String(text ?? ""); after(); },
              (err     ) => { S[target] = `⚠️ ${err && err.message ? err.message : String(err)}`; after(); },
            );
          break;
        }
        case "draw": io.draw(s.op, s.a.map(E), s.line); break;
        case "obj": io.obj(s.op, s.n, s.a.map((x     ) => toNum(E(x))), s.line); break;
        case "cam": io.cam(toNum(E(s.e))); break;
        case "call": callUser(s.n, s.a.map(E), s.line); break;
        case "stop": stopTimers(); break;
        case "resume": startTimers(); break;
        case "ret": throw { navaRet: true, value: s.e ? E(s.e) : undefined };
      }
    }
  };

  const pick = () => { const o      = {}; for (const n of P.persist) o[n] = S[n]; return o; };
  const persist = () => {
    if (!P.persist.length) return;
    const snap = JSON.stringify(pick());
    if (snap === lastSaved) return;
    lastSaved = snap;
    try { Promise.resolve(io.save(JSON.parse(snap))).catch(() => {}); } catch { /* ذخیره ممکن نشد */ }
  };
  function after() { io.render(); persist(); }
  const report = (err     ) => {
    const msg = (err && err.navaLine ? `خط ${err.navaLine}: ` : "") + (err && err.message ? err.message : String(err));
    stopTimers();
    if (!reported) { reported = true; io.error(msg); }
  };
  const handle = (body                          ) => {
    if (!body) return;
    steps = 0; depth = 0;
    try { exec(body, child(root)); } catch (err     ) { if (!(err && err.navaRet)) report(err); }
    after();
  };
  function stopTimers() { for (const t of timers) io.clearInterval(t); timers = []; running = false; }
  function startTimers() {
    if (running) return;
    running = true;
    for (const t of P.timers) {

(function mountUtility(id        , kind        , duration        ) {
  const root = document.getElementById(id) ;
  const output = root.querySelector             ("output") ;
  let count = 0, remaining = duration * 1000, deadline = 0, running = false;
  const render = () => {
    if (kind === "counter") output.textContent = new Intl.NumberFormat("fa-IR").format(count);
    else { const seconds = Math.ceil(Math.max(0, remaining) / 1000); output.textContent = String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0"); }
  };
  root.addEventListener("click", (event) => {
    const key = (event.target               ).closest             ("[data-utility]")?.dataset.utility;
    if (kind === "counter") { if (key === "add") count++; if (key === "sub") count--; if (key === "reset") count = 0; }
    else {
      if (key === "start" && remaining > 0) { deadline = Date.now() + remaining; running = true; }
      if (key === "pause") { if (running) remaining = Math.max(0, deadline - Date.now()); running = false; }
      if (key === "reset") { running = false; remaining = duration * 1000; }
    }
    render();
  });
  if (kind === "timer") {
    const update = () => { if (running) { remaining = Math.max(0, deadline - Date.now()); if (remaining === 0) running = false; render(); } requestAnimationFrame(update); };
    requestAnimationFrame(update);
  }
  render();
