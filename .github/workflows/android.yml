name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Verify Nava and launcher
        run: |
          npm run typecheck
          npm run test:launcher
      - name: Build web (static SPA)
        run: npm run build:mobile
      - name: Generate Android project
        run: |
          npx cap add android
          npm run android:prepare
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CodePad-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish CodePad 2.5.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CodePad.apk
          cat > release-notes.md <<'NOTES'
          Fullscreen launcher: tools appear only when requested; Android system bars appear temporarily with an edge swipe.
          Nava Studio 0.6 adds Latin defaults, packed instructions with |, frame animation, torus/cylinder/cone, material controls, fog, lighting and touch orbit.
          The launcher now runs the selected edited project file and retains its entry in backups and exported packs.
          Debug Android APK. Back up your projects before replacing a build signed with a different debug key.
          NOTES
          if gh release view v2.5.1 >/dev/null 2>&1; then
            gh release upload v2.5.1 CodePad.apk --clobber
          else
            gh release create v2.5.1 CodePad.apk --target "$GITHUB_SHA" --title "CodePad 2.5.1 · Fullscreen" --notes-file release-notes.md
          fi
